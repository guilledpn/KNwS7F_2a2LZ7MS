<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Muestra de ingresos · CRM FFVV</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f9ff;--surface:#fff;--low:#f1f6fe;--container:#e8f0fb;--high:#dfe8f5;--outline:#c8d2e1;--variant:#e1e8f2;--text:#1d1b20;--muted:#5f6773;--primary:#2563eb;--pc:#dbe6ff;--opc:#16336f;--ok:#1b7f56;--okbg:#d8f3e7;--danger:#b3261e;--shadow:0 1px 2px rgba(29,27,32,.08),0 2px 6px rgba(29,27,32,.04);--sans:'Roboto',system-ui,sans-serif;--mono:'Roboto Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;background:var(--bg);font-family:var(--sans);color:var(--text)}button,input{font:inherit}.shell{max-width:520px;margin:auto;min-height:100dvh;padding:0 14px 28px}.top{position:sticky;top:0;z-index:5;background:rgba(246,249,255,.94);backdrop-filter:blur(12px);padding:12px 4px 10px}.toprow{display:flex;align-items:center;gap:8px}.title{font-size:21px;font-weight:700;letter-spacing:-.02em}.spacer{flex:1}.env{font:700 10px var(--mono);padding:6px 8px;border-radius:10px;background:var(--container);color:var(--muted)}.progress{margin-top:9px;height:7px;border-radius:4px;background:var(--high);overflow:hidden}.fill{height:100%;background:var(--primary);width:0}.sub{font-size:12px;color:var(--muted);margin-top:6px}.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);margin:8px 0;padding:14px}.login{max-width:420px;margin:12vh auto 0}.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 4px 6px}.input{width:100%;height:48px;border:1px solid var(--variant);background:var(--low);border-radius:16px;padding:0 14px;font-size:16px;outline:none}.input:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}.primary{height:48px;border:0;border-radius:16px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.secondary{height:38px;border:1px solid var(--outline);background:var(--surface);border-radius:14px;padding:0 12px;font-weight:600;color:var(--muted);cursor:pointer}.secondary:disabled{opacity:.38;cursor:default}.row{width:100%;min-height:70px;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:40px 1fr 60px 20px;align-items:center;gap:8px;padding:8px 4px;cursor:pointer}.row+.row{border-top:1px solid var(--variant)}.row.completed{opacity:.58}.seq{width:34px;height:34px;border-radius:17px;background:var(--pc);color:var(--opc);display:grid;place-items:center;font:700 11px var(--mono)}.name{font-size:14.5px;font-weight:700;line-height:1.2}.rut{font:600 11.5px var(--mono);color:var(--muted);margin-top:5px}.rowstate{font-size:10.5px;font-weight:700;color:var(--ok);text-align:right}.chev{font-size:22px;color:#9aa3af}.empty{text-align:center;color:var(--muted);padding:48px 12px}.detail{display:none}.detail.on{display:block}.list.off{display:none}.back{height:36px;border:0;background:transparent;color:var(--primary);font-weight:700;cursor:pointer}.hero{padding:16px}.hero h2{font-size:21px;line-height:1.15}.rutline{margin-top:10px;display:flex;align-items:center;gap:10px}.meta{font:700 14px var(--mono);color:var(--text);flex:1}.copybtn{height:38px;border:1px solid var(--outline);background:var(--low);border-radius:13px;padding:0 12px;color:var(--primary);font-weight:700;cursor:pointer}.sectiontitle{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:9px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{min-height:50px;border:1px solid var(--outline);border-radius:15px;background:var(--surface);padding:7px 9px;text-align:left;font-size:12.2px;font-weight:700;cursor:pointer}.choice.on{background:var(--pc);border-color:var(--primary);color:var(--opc)}.exactwrap{margin-top:9px;display:grid;grid-template-columns:1fr auto;gap:8px}.exactbtn{border:1px solid var(--outline);border-radius:15px;background:var(--surface);padding:0 12px;font-weight:700;cursor:pointer}.status{margin-top:8px;font-size:12px;color:var(--muted);min-height:18px}.actions{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:10px}.actions .primary{width:100%}.saving{opacity:.6;pointer-events:none}.done{background:var(--okbg);color:var(--ok);border-radius:16px;padding:14px;text-align:center;font-weight:700}.err{color:var(--danger);font-size:12px;margin-top:10px}.hidden{display:none!important}
@media(max-height:720px){.top{padding-top:8px}.card{margin:6px 0;padding:12px}.hero{padding:13px}.choice{min-height:46px}.label{margin-top:8px}.input,.primary{height:45px}}
</style>
</head>
<body>
<div class="shell">
  <div id="login" class="login hidden">
    <div class="card">
      <div class="title">Muestra de ingresos</div>
      <div class="sub">Usa la misma cuenta del CRM.</div>
      <div class="label">Correo</div><input id="email" class="input" type="email" autocomplete="username">
      <div class="label">Contraseña</div><input id="pass" class="input" type="password" autocomplete="current-password">
      <button class="primary" style="width:100%;margin-top:14px" onclick="login()">Entrar</button>
      <div id="loginerr" class="err"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="top">
      <div class="toprow"><div><div class="title">Muestra de ingresos</div><div class="sub" id="sampletitle"></div></div><div class="spacer"></div><span id="env" class="env"></span><button class="secondary" onclick="reload()">Actualizar</button></div>
      <div class="progress"><div id="fill" class="fill"></div></div>
      <div id="progressText" class="sub"></div>
    </div>

    <div id="listView" class="list"><div id="rows" class="card"></div></div>

    <div id="detailView" class="detail">
      <button class="back" onclick="closeDetail()">← Volver a la muestra</button>
      <div class="card hero">
        <h2 id="dname"></h2>
        <div class="rutline"><div id="drut" class="meta"></div><button class="copybtn" onclick="copyCurrentRut()">Copiar RUT</button></div>
      </div>
      <div class="card">
        <div class="sectiontitle">Ingreso estimado observado</div>
        <div class="choices" id="choices">
          <button class="choice" data-kind="none" data-value="0" onclick="choose(this)">Sin información</button>
          <button class="choice" data-kind="range_0_1999999" data-value="10000001999999" onclick="choose(this)">$0 – $1.999.999</button>
          <button class="choice" data-kind="range_2000000_2999999" data-value="20000002999999" onclick="choose(this)">$2.000.000 – $2.999.999</button>
          <button class="choice" data-kind="range_3000000_3999999" data-value="30000003999999" onclick="choose(this)">$3.000.000 – $3.999.999</button>
          <button class="choice" data-kind="range_4000000_plus" data-value="4000000" onclick="choose(this)">Más de $4.000.000</button>
        </div>
        <div class="label">Valor específico, cuando esté disponible</div>
        <div class="exactwrap"><input id="exact" class="input" inputmode="numeric" placeholder="Ej. 2456987" oninput="exactChanged()"><button class="exactbtn" onclick="useExact()">Usar exacto</button></div>
        <div id="captureStatus" class="status">Selecciona un rango, “Sin información” o ingresa un valor exacto.</div>
        <div class="actions"><button id="prevBtn" class="secondary" onclick="previousContact()">← Anterior</button><button id="saveNext" class="primary" onclick="saveAndNext()">Guardar y siguiente</button></div>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
const qs=new URLSearchParams(location.search);
const IS_DEV=qs.get('env')==='dev';
const SAMPLE_KEY=qs.get('sample')||'RENTA_202607_V1';
const CONFIG=IS_DEV
 ? {url:'https://xcujixexjbuqqzlbomgw.supabase.co',key:'sb_publishable_eCchzuWGoCSl_Vnvyv_cYg_0A2CTDK8'}
 : {url:'https://lijibbhpyyptodneafdd.supabase.co',key:'sb_publishable_V1zmg6OBVG5wzda9r0t9cg_VPT8xh55'};
const sb=window.supabase.createClient(CONFIG.url,CONFIG.key);
let sample=null,rows=[],currentIndex=-1,chosen=null,saving=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatRut(v){let s=String(v||'').replace(/[^0-9kK]/g,'').toUpperCase();return s.length>1?s.slice(0,-1)+'-'+s.slice(-1):s}
function setAuth(showLogin){$('login').classList.toggle('hidden',!showLogin);$('app').classList.toggle('hidden',showLogin)}
async function boot(){const {data}=await sb.auth.getSession();if(data?.session){setAuth(false);$('env').textContent=IS_DEV?'DEV':'PROD';await reload()}else setAuth(true)}
async function login(){const email=$('email').value.trim(),password=$('pass').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error){$('loginerr').textContent=error.message;return}setAuth(false);$('env').textContent=IS_DEV?'DEV':'PROD';await reload()}
async function reload(){closeDetail();$('rows').innerHTML='<div class="empty">Cargando muestra…</div>';const {data,error}=await sb.rpc('get_analysis_sample_v1',{p_sample_key:SAMPLE_KEY,p_pending_only:false,p_limit:200,p_offset:0});if(error){$('rows').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}if(!data?.ok){$('rows').innerHTML='<div class="empty">La muestra todavía no está disponible.</div>';return}sample=data;rows=(data.rows||[]).sort((a,b)=>Number(a.sample_sequence)-Number(b.sample_sequence));render()}
function render(){const total=Number(sample.sample_total||0),done=Number(sample.sample_completed||0),pending=Number(sample.sample_pending||0);$('sampletitle').textContent=sample.title||SAMPLE_KEY;$('progressText').textContent=`${done} completados · ${pending} pendientes · ${total} total`;$('fill').style.width=(total?Math.round(done/total*100):0)+'%';if(!rows.length){$('rows').innerHTML='<div class="done">Muestra sin contactos.</div>';return}const firstPending=rows.findIndex(r=>!r.sample_completed);const continueText=firstPending<0?'<div class="done">Muestra completada. Puedes reabrir cualquier contacto para corregirlo.</div>':'';$('rows').innerHTML=continueText+rows.map((r,i)=>`<button class="row ${r.sample_completed?'completed':''}" onclick="openDetail(${i})"><span class="seq">${r.sample_sequence}</span><span><span class="name">${esc(r.nombre||'Sin nombre')}</span><span class="rut">${esc(formatRut(r.rut||r.rut_norm||''))}</span></span><span class="rowstate">${r.sample_completed?'Guardado':''}</span><span class="chev">›</span></button>`).join('')}
function restoreCaptured(r){chosen=null;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));$('exact').value='';if(!r?.sample_completed)return;const v=Number(r.sample_captured_income??0);const button=[...document.querySelectorAll('.choice')].find(x=>Number(x.dataset.value)===v);if(button){button.classList.add('on');chosen={kind:button.dataset.kind,value:v};$('captureStatus').textContent='Valor guardado: '+button.textContent.trim();return}if(v>0){$('exact').value=String(Math.trunc(v));chosen={kind:'exact',value:v};$('captureStatus').textContent='$ '+v.toLocaleString('es-CL')+' exacto · guardado';return}const none=document.querySelector('.choice[data-kind="none"]');if(none){none.classList.add('on');chosen={kind:'none',value:0};$('captureStatus').textContent='Valor guardado: Sin información'}}
function openDetail(i){if(i<0||i>=rows.length)return;currentIndex=i;const r=rows[i];$('dname').textContent=r.nombre||'Sin nombre';$('drut').textContent=formatRut(r.rut||r.rut_norm||'');$('captureStatus').textContent='Selecciona un rango, “Sin información” o ingresa un valor exacto.';restoreCaptured(r);$('prevBtn').disabled=i<=0;$('listView').classList.add('off');$('detailView').classList.add('on');scrollTo(0,0)}
function closeDetail(){$('detailView').classList.remove('on');$('listView').classList.remove('off');currentIndex=-1;chosen=null}
function choose(btn){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));btn.classList.add('on');$('exact').value='';chosen={kind:btn.dataset.kind,value:Number(btn.dataset.value)};$('captureStatus').textContent=btn.textContent.trim()}
function exactChanged(){if($('exact').value.replace(/\D/g,'')){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));chosen=null;$('captureStatus').textContent='Pulsa “Usar exacto” para confirmar el valor.'}}
function useExact(){const d=$('exact').value.replace(/\D/g,'');const v=Number(d||0);if(!v){$('captureStatus').textContent='Ingresa un valor específico válido.';return}document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));chosen={kind:'exact',value:v};$('captureStatus').textContent='$ '+v.toLocaleString('es-CL')+' exacto'}
function currentRut(){const r=rows[currentIndex];return r?formatRut(r.rut||r.rut_norm||''):''}
async function copyText(text){if(!text)return false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return true}}catch(_e){}try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return !!ok}catch(_e){return false}}
async function copyCurrentRut(){const rut=currentRut();const ok=await copyText(rut);$('captureStatus').textContent=ok?`RUT ${rut} copiado.`:'No se pudo copiar automáticamente. Usa el botón nuevamente.'}
function previousContact(){if(saving||currentIndex<=0)return;openDetail(currentIndex-1)}
function nextPendingIndex(after){for(let i=after+1;i<rows.length;i++)if(!rows[i].sample_completed)return i;for(let i=0;i<=after;i++)if(!rows[i].sample_completed)return i;return -1}
async function saveAndNext(){if(saving||currentIndex<0)return;if(!chosen){$('captureStatus').textContent='Falta seleccionar o confirmar el ingreso.';return}saving=true;$('detailView').classList.add('saving');const savedIndex=currentIndex,r=rows[savedIndex],ing=Number(chosen.value||0);try{const g=await sb.rpc('save_gestion_v2',{p_work_item_id:r.work_item_id,p_contact_id:r.contact_id,p_active_period:null,p_estado:r.estado_gestion||'Pendiente',p_ingreso:ing,p_comentarios:r.comentarios||''});if(g.error)throw g.error;const c=await sb.rpc('complete_analysis_sample_item_v1',{p_sample_item_id:r.sample_item_id,p_ingreso:ing});if(c.error)throw c.error;if(!c.data?.ok)throw new Error(c.data?.code||'No se pudo guardar el ítem');r.sample_completed=true;r.sample_captured_income=ing;sample.sample_total=c.data.sample_total;sample.sample_completed=c.data.sample_completed;sample.sample_pending=c.data.sample_pending;render();const next=nextPendingIndex(savedIndex);if(next>=0){openDetail(next);const rut=currentRut();const copied=await copyText(rut);$('captureStatus').textContent=copied?`RUT ${rut} copiado. Selecciona el ingreso.`:'Nuevo contacto listo. Copia el RUT con el botón.'}else{openDetail(savedIndex);$('captureStatus').textContent='Muestra completada. Puedes usar “Anterior” para revisar y corregir observaciones.'}}catch(e){$('captureStatus').textContent='Error: '+(e.message||e)}finally{saving=false;$('detailView').classList.remove('saving')}}
sb.auth.onAuthStateChange((_event,session)=>{if(!session)setAuth(true)});
boot();
</script>
</body>
</html>
